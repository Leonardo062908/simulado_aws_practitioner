name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate the question bank and run the tests
        run: |
          node validate.js
          node test.js

      # No build step: the site is plain HTML/CSS/JS. Only the files the browser needs are published.
      - name: Assemble the site
        run: |
          mkdir -p _site/questions
          cp index.html style.css app.js og-image.png _site/
          cp questions/d1-conceitos.json questions/d2-seguranca.json questions/d3-tecnologia.json questions/d4-precos.json _site/questions/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
