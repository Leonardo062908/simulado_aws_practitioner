<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)">
  <title>Simulado CLF-C02</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232456d6'/%3E%3Cpath d='M9 17l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita "piscar").
    (function () {
      try {
        var t = localStorage.getItem('clf02.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* sem localStorage: segue o tema do sistema */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header class="topbar">
    <a href="#" class="brand" id="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </span>
      <span class="brand__text">
        <strong>Simulado CLF-C02</strong>
        <span class="brand__sub">AWS Certified Cloud Practitioner</span>
      </span>
    </a>
    <div class="topbar__right">
      <div id="timer-slot"></div>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Alternar tema"></button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="muted">Carregando questões…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg" class="dialog" aria-labelledby="dlg-title"></dialog>

  <noscript><p class="container">Ative o JavaScript para usar o simulado.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
